<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BORDERLAND - LIVE SYSTEM</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // הגדרות הפיירבייס שלך
        const firebaseConfig = {
            apiKey: "AIzaSyDCmXZoM__bVIQ8xok5uv6UVf_DERvh4bY",
            authDomain: "elias-7d300.firebaseapp.com",
            projectId: "elias-7d300",
            storageBucket: "elias-7d300.firebasestorage.app",
            messagingSenderId: "90471380067",
            appId: "1:90471380067:web:607b69d25d32559a47f456"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // פונקציה לרישום משתמש
        window.registerUser = function() {
            const name = document.getElementById('userNameInput').value;
            if(!name) return alert("הכנס שם!");
            
            const userRef = ref(db, 'users/' + name);
            set(userRef, {
                name: name,
                lastSeen: Date.now()
            });

            localStorage.setItem('borderland_user', name);
            showScreen('visaScreen');
        };

        // האזנה לשחקנים בזירה
        const usersRef = ref(db, 'users');
        onValue(usersRef, (snapshot) => {
            const data = snapshot.val();
            const listElement = document.getElementById('playersList');
            if (data) {
                const names = Object.keys(data).join(", ");
                listElement.innerText = "שחקנים בזירה: " + names;
            }
        });
    </script>

    <style>
        body { 
            background-color: #fff; color: #000; font-family: 'Helvetica Neue', sans-serif; 
            text-align: center; margin: 0; min-height: 100vh; display: flex; flex-direction: column; 
        }
        .screen { display: none; flex: 1; flex-direction: column; justify-content: center; align-items: center; padding: 20px; animation: fadeIn 0.5s; }
        .active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* עיצוב הוויזה מהתמונה */
        .game-tag { font-size: 1.2rem; margin-bottom: 20px; letter-spacing: 3px; }
        .suit-icons { font-size: 3rem; margin-bottom: 40px; }
        .timer-display { font-size: 4rem; font-weight: bold; margin: 10px 0; }
        .jp-text { font-size: 1rem; color: #333; margin: 5px 0; }

        /* פאנל שחקנים למטה */
        #livePlayers { 
            position: fixed; bottom: 0; width: 100%; background: #000; color: #fff; 
            padding: 10px; font-size: 0.8rem; text-align: center; border-top: 2px solid red;
        }

        /* כפתורי ניהול ודילוג */
        .admin-bar { background: #eee; padding: 10px; display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
        .skip-btn { background: #333; color: #fff; border: none; padding: 5px 10px; font-size: 12px; cursor: pointer; border-radius: 5px; }
        .main-btn { background: #000; color: #fff; border: none; padding: 20px; width: 80%; font-size: 1.2rem; margin-top: 20px; border-radius: 10px; }

        input { padding: 15px; width: 70%; border: 2px solid #000; font-size: 1.2rem; margin-bottom: 10px; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="admin-bar">
        <button class="skip-btn" onclick="showScreen('regScreen')">רישום</button>
        <button class="skip-btn" onclick="showScreen('visaScreen')">וויזה</button>
        <button class="skip-btn" onclick="showScreen('missionA')">דלג לא'</button>
        <button class="skip-btn" onclick="showScreen('missionB')">דלג לב'</button>
        <button class="skip-btn" onclick="showScreen('missionC')">דלג לג'</button>
        <button class="skip-btn" onclick="showScreen('missionD')">דלג לד'</button>
    </div>

    <div id="regScreen" class="screen active">
        <h1>【 REGISTRATION 】</h1>
        <input type="text" id="userNameInput" placeholder="הכנס את שמך...">
        <button class="main-btn" onclick="window.registerUser()">הצטרף למשחק</button>
    </div>

    <div id="visaScreen" class="screen">
        <div class="game-tag">【 GAME 】</div>
        <div class="suit-icons">♣️ ♣️ ♣️</div>
        <div class="jp-text">ゲームに生き残った方へ</div>
        <div class="timer-display" id="countDown">00:00:00</div>
        <div class="jp-text">のビザを支給します</div>
    </div>

    <div id="missionA" class="screen"><h2>משימה א' ♠️</h2><p>רוץ לנקודת ה-GPS!</p><button class="main-btn" onclick="alert('בודק GPS...')">בדוק הגעה</button></div>
    <div id="missionB" class="screen"><h2>משימה ב' ♣️</h2><p>שתפו פעולה!</p></div>
    <div id="missionC" class="screen"><h2>משימה ג' ♦️</h2><p>פתרו את החידה!</p></div>
    <div id="missionD" class="screen"><h2>משימה ד' ♥️</h2><p>מצאו את החפרפרת (666)</p><button class="main-btn" onclick="checkFinal()">הזן קוד</button></div>

    <div id="livePlayers">
        <span id="playersList">מחבר למערכת הגבולות...</span>
    </div>

    <script>
        const targetDate = new Date("April 2, 2026 16:00:00").getTime();

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        setInterval(() => {
            const now = new Date().getTime();
            const diff = targetDate - now;
            if (diff <= 0) {
                if(document.getElementById('visaScreen').classList.contains('active')) showScreen('missionA');
                return;
            }
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            document.getElementById('countDown').innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }, 1000);

        function checkFinal() {
            let c = prompt("קוד:");
            if(c === "666") alert("GAME CLEARED!");
        }
    </script>
</body>
</html>
