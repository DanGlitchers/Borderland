<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALICE IN BORDERLAND - THE GAME</title>
    <style>
        body { 
            background-color: #000; 
            color: #ff0000; 
            font-family: 'Courier New', monospace; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        .screen { display: none; min-height: 100vh; }
        .active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        h1 { font-size: 2.2rem; text-shadow: 0 0 15px #ff0000; letter-spacing: 2px; }
        
        .timer-box { 
            font-size: 3.5rem; 
            margin: 20px 0; 
            border: 3px double #ff0000; 
            padding: 15px; 
            background: rgba(255, 0, 0, 0.1);
        }

        .btn { 
            background: #ff0000; 
            color: #000; 
            border: none; 
            padding: 20px; 
            font-weight: bold; 
            font-size: 1.3rem; 
            cursor: pointer; 
            width: 90%; 
            max-width: 400px;
            box-shadow: 0 0 10px #ff0000;
        }

        input { 
            background: #111; 
            color: #fff; 
            border: 2px solid #ff0000; 
            padding: 15px; 
            width: 80%; 
            font-size: 1.2rem; 
            margin-bottom: 20px; 
            text-align: center;
        }

        .info-panel { 
            border: 1px solid #555; 
            padding: 15px; 
            margin: 20px 0; 
            color: #ccc; 
            font-size: 0.9rem; 
            width: 90%;
        }

        .role-alert { 
            color: #fff; 
            background: #600; 
            padding: 10px; 
            font-weight: bold; 
            border: 1px solid red;
            margin-bottom: 15px;
        }

        #status-msg { margin-top: 10px; font-weight: bold; color: white; }
    </style>
</head>
<body>

    <div id="login" class="screen active">
        <h1>ENTRY PERMIT</h1>
        <p>הכנס שם לזיהוי במערכת:</p>
        <input type="text" id="userName" placeholder="שם המשתתף...">
        <button class="btn" onclick="startGame()">אישור כניסה</button>
    </div>

    <div id="main" class="screen">
        <h1 id="greet">שלום, שחקן</h1>
        
        <div id="roleDisplay" style="display:none;" class="role-alert">
            אזהרה: אתה החפרפרת. מנע מהם להזין קוד נכון!
        </div>

        <div class="timer-box" id="clock">00:00:00</div>

        <div class="info-panel">
            <strong>משימה נוכחית:</strong>
            <p id="missionDesc">המתן לתחילת המשחק ב-16:00</p>
        </div>

        <button class="btn" id="mainBtn" onclick="handleAction()">בדיקת מצב משימה</button>
        <div id="status-msg">מזהה מיקום...</div>
    </div>

    <script>
        let user = "";
        let winAttempt = 0;

        // נקודות ה-GPS שנתת (פארק ענבה)
        const gameCenter = { lat: 32.10536, lon: 34.87722 }; // המיקום המרכזי
        const sprintTarget = { lat: 32.10725, lon: 34.87786 }; // נקודת הריצה
        const radius = 0.0006; // רדיוס דיוק (כ-60 מטר)

        function startGame() {
            user = document.getElementById('userName').value;
            if(!user) return alert("הכנס שם!");
            document.getElementById('login').classList.remove('active');
            document.getElementById('main').classList.add('active');
            document.getElementById('greet').innerText = "שחקן: " + user;
            
            // התחלת עדכון לוגיקה בכל שניה
            setInterval(updateGame, 1000);
        }

        function updateGame() {
            const now = new Date();
            const h = now.getHours();
            const m = now.getMinutes();
            const s = now.getSeconds();

            // עדכון שעון
            document.getElementById('clock').innerText = 
                `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

            // לוגיקת שלב א' (16:00 - 17:00)
            if (h === 16) {
                document.getElementById('missionDesc').innerText = "עלה ♠️: רוצו לנקודת הציון המסומנת! האחרון שמגיע - הוויזה שלו פוקעת.";
                document.getElementById('mainBtn').innerText = "אישור הגעה לנקודת ריצה";
            } 
            // לוגיקת שלב ב' (17:00 - 17:30)
            else if (h === 17 && m < 30) {
                document.getElementById('missionDesc').innerText = "לב ♥️: משחק האמון. מצאו את הקוד 666 והזינו אותו יחד.";
                document.getElementById('roleDisplay').style.display = "block"; // לכולם יוצג שהם החפרפרת
                document.getElementById('mainBtn').innerText = "הזן קוד ניטרול";
            } 
            else if (h >= 17 && m >= 30) {
                document.getElementById('missionDesc').innerText = "המשחק הסתיים.";
                document.getElementById('mainBtn').style.display = "none";
            }
        }

        function handleAction() {
            const h = new Date().getHours();

            if (h === 16) {
                verifyLocation(sprintTarget);
            } else if (h === 17) {
                let code = prompt("הכנס קוד לניטרול הפצצה:");
                if (code === "666") {
                    if (winAttempt === 0) {
                        alert("שגיאת מערכת: הקוד נחסם ע\"י החפרפרת! נסו שוב.");
                        winAttempt++;
                    } else {
                        alert("GAME CLEARED! הצלחתם לשרוד.");
                        document.body.innerHTML = "<h1 style='color:#00ff00; margin-top:100px;'>GAME CLEARED</h1>";
                    }
                } else {
                    alert("קוד שגוי. נסו שוב.");
                }
            } else {
                alert("אין משימה פעילה כרגע.");
            }
        }

        function verifyLocation(target) {
            if (navigator.geolocation) {
                document.getElementById('status-msg').innerText = "בודק מיקום...";
                navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    
                    // חישוב מרחק פשוט
                    const dist = Math.sqrt(Math.pow(lat - target.lat, 2) + Math.pow(lon - target.lon, 2));
                    
                    if (dist < radius) {
                        document.getElementById('status-msg').innerText = "סטטוס: בתוך הזירה. בטוח.";
                        alert("הגעת בזמן! הוויזה הוארכה.");
                    } else {
                        document.getElementById('status-msg').innerText = "סטטוס: מחוץ לזירה!";
                        alert("אתה רחוק מדי! המשך לרוץ לנקודה!");
                    }
                }, () => {
                    alert("שגיאה: נא לאשר גישת GPS בטלפון!");
                });
            }
        }
    </script>
</body>
</html>
