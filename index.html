<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BORDERLAND VISA</title>
    <style>
        body { 
            background-color: #fff; 
            color: #000; 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            margin: 0; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* עיצוב הוויזה כמו בתמונה */
        #visaScreen { display: none; }
        .visa-active { display: flex; flex-direction: column; }
        
        .game-header { font-size: 1.2rem; margin-bottom: 30px; }
        .suit-icons { font-size: 3rem; color: #000; letter-spacing: 5px; margin-bottom: 60px; }
        
        .japanese-text { font-size: 1.1rem; color: #000; margin-bottom: 20px; }
        .clock-count { font-size: 3rem; color: #000; font-weight: bold; margin-bottom: 10px; }
        .days-text { font-size: 1.2rem; color: #000; font-weight: bold; margin-bottom: 20px; }

        /* עיצוב מסכי המשימה */
        .mission-screen { display: none; }
        .mission-active { display: flex; flex-direction: column; }
        .action-btn { background: #000; color: #fff; border: none; padding: 20px; width: 80%; font-size: 1.2rem; cursor: pointer; border-radius: 10px; }
        .status-msg { margin-top: 10px; color: #000; font-weight: bold; }

        /* כפתורי טסט - להורדה אחר כך */
        #testControls { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffff00; padding: 10px; display: flex; justify-content: center; gap: 10px; z-index: 1000; }
        .test-btn { background: #000; color: #fff; border: 1px solid white; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="visaScreen" class="visa-active">
        <div class="game-header">【GAME】</div>
        <div class="suit-icons">♣️ ♣️ ♣️</div>
        
        <div class="japanese-text">ゲームに生き残った方へ</div>
        
        <div class="clock-count" id="clock">00:00:00</div>
        <div class="days-text">日間</div>
        
        <div class="japanese-text">のビザを支給します</div>
    </div>

    <div id="missionAScreen" class="mission-screen">
        <h2>משימה א' ♠️</h2>
        <p>משימת עלה: הגע לנקודת הציון בפארק. האחרון מפסיד.</p>
        <button class="action-btn" onclick="verifyLocation()">בדוק הגעה ליעד</button>
        <div class="status-msg" id="gps-msg">סורק GPS...</div>
    </div>

    <div id="missionBScreen" class="mission-screen">
        <h2>משימה ב' ♥️</h2>
        <p>משימת לב: משחק האמון. מצאו את הקוד 666.</p>
        <button class="action-btn" onclick="inputWinCode()">הזן קוד ניטרול</button>
    </div>

    <div id="winScreen" class="mission-screen">
        <h1 style="color: #00aa00; font-size: 3rem;">GAME CLEARED</h1>
    </div>

    <div id="testControls">
        <button class="test-btn" onclick="testStartGame()">טסט לתחילת משחק</button>
        <button class="test-btn" onclick="testSkipToMissionB()">דילוג למשימה ב'</button>
    </div>

    <script>
        // תאריך תחילת המשחק: 2 באפריל, 2026, 16:00
        const gameStart = new Date("April 2, 2026 16:00:00").getTime();
        
        // קואורדינטות פארק ענבה
        const targetSprint = { lat: 32.10725, lon: 34.87786 };
        const radius = 0.0006; // רדיוס כ-60 מטר
        
        let winAttempt = 0;

        function updateClock() {
            const now = new Date().getTime();
            const dist = gameStart - now;

            // אם הזמן הגיע
            if (dist < 0) {
                document.getElementById('visaScreen').classList.remove('visa-active');
                document.getElementById('missionAScreen').classList.add('mission-active');
                clearInterval(clockInterval);
                return;
            }

            // חישוב הזמן שנותר
            const days = Math.floor(dist / (1000 * 60 * 60 * 24));
            const hours = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((dist % (1000 * 60)) / 1000);

            // עדכון התצוגה (אם יש ימים, מראים אותם)
            if (days > 0) {
                document.getElementById('clock').innerText = days;
                document.getElementById('clock').style.fontSize = "5rem";
                document.querySelector('.days-text').style.display = "block";
            } else {
                document.getElementById('clock').innerText = `${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
                document.getElementById('clock').style.fontSize = "3rem";
                document.querySelector('.days-text').style.display = "none";
            }
        }
        let clockInterval = setInterval(updateClock, 1000);

        // לוגיקת משחק א'
        function verifyLocation() {
            if (navigator.geolocation) {
                document.getElementById('gps-msg').innerText = "בודק מיקום...";
                navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const dist = Math.sqrt(Math.pow(lat - targetSprint.lat, 2) + Math.pow(lon - targetSprint.lon, 2));
                    
                    if (dist < radius) {
                        document.getElementById('gps-msg').innerText = "סטטוס: בתוך הזירה. בטוח.";
                        alert("ויזה הוארכה.");
                    } else {
                        document.getElementById('gps-msg').innerText = "סטטוס: מחוץ לזירה!";
                        alert("אתה מחוץ לטווח. רוץ!");
                    }
                }, () => { alert("שגיאת GPS. נא לאשר הרשאות!"); });
            }
        }

        // לוגיקת משחק ב'
        function inputWinCode() {
            let code = prompt("הכנס קוד לניטרול:");
            if (code === "666") {
                if (winAttempt === 0) {
                    alert("שגיאת מערכת. נסה שוב.");
                    winAttempt++;
                } else {
                    document.getElementById('missionBScreen').classList.remove('mission-active');
                    document.getElementById('winScreen').classList.add('mission-active');
                }
            } else {
                alert("קוד שגוי.");
            }
        }

        // פונקציות טסט
        function testStartGame() {
            document.getElementById('visaScreen').classList.remove('visa-active');
            document.getElementById('missionAScreen').classList.add('mission-active');
            document.getElementById('testControls').style.display = "none";
            clearInterval(clockInterval);
        }

        function testSkipToMissionB() {
            document.getElementById('visaScreen').classList.remove('visa-active');
            document.getElementById('missionAScreen').classList.remove('mission-active');
            document.getElementById('missionBScreen').classList.add('mission-active');
            document.getElementById('testControls').style.display = "none";
            clearInterval(clockInterval);
        }
    </script>
</body>
</html>
